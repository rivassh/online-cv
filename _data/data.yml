career-profile:
    title: Career Profile
    summary: |
      Senior Backend, Platform & Infrastructure Engineer with 10+ years of experience in Linux/Windows server environments,
      backend development, DevOps, and production support. Proven expertise in containerization (Docker, Kubernetes),
      CI/CD pipelines (GitLab), database systems (PostgreSQL, MySQL, MSSQL, MongoDB), and cloud platforms (VMware, KVM, OpenStack).
      Skilled in monitoring tools (Prometheus, Grafana, Zabbix), networking, and infrastructure troubleshooting.
      Strong background in software development using PHP/Laravel, Python, and Java, with solid understanding of design patterns,
      REST APIs, and clean code principles.

