{% assign roles = site.data.data.roles %}
<div id="role-content" class="role-content">
  <div id="active-role-header" class="role-header">
    <span id="active-role-symbol" class="role-header-symbol"></span>
    <div class="role-header-text">
      <h2 id="active-role-title" class="role-header-title"></h2>
      <p id="active-role-tagline" class="role-header-tagline"></p>
    </div>
  </div>

  <div class="role-details">
    <div class="role-bullets">
      <h4>Key Focus Areas</h4>
      <ul id="role-bullets-list" class="role-bullets-list"></ul>
    </div>
  </div>

  <div id="experiences-filtered" class="experiences-section">
    <h2 class="section-title"><i class="fas fa-briefcase"></i> Related Experience</h2>
    <div id="experiences-list" class="experiences-list"></div>
  </div>
</div>
